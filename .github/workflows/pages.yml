name: Build APK, Publish Release & Deploy Web Portal

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-release"
  cancel-in-progress: false

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      apk_name: ${{ steps.meta.outputs.apk_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Read release metadata
        id: meta
        run: |
          VERSION=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("web/version.json","utf8")).version)')
          CHANGELOG=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("web/version.json","utf8")).changelog)')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=VIZYON.TV.${VERSION}.apk" >> "$GITHUB_OUTPUT"
          echo "changelog=$CHANGELOG" >> "$GITHUB_OUTPUT"

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Android APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare release artifacts
        run: |
          mkdir -p dist_release web/releases
          cp app/build/outputs/apk/debug/app-debug.apk "dist_release/${{ steps.meta.outputs.apk_name }}"
          cp app/build/outputs/apk/debug/app-debug.apk "web/releases/${{ steps.meta.outputs.apk_name }}"
          cp app/build/outputs/apk/debug/app-debug.apk "web/releases/vizyontv-latest.apk"

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: "VİZYON TV PRO ${{ steps.meta.outputs.version }}"
          body: ${{ steps.meta.outputs.changelog }}
          files: dist_release/*.apk

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "web"

  deploy_pages:
    needs: build_and_release
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
